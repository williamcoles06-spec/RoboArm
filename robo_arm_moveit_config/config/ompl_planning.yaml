# Same planning_plugins/adapters as moveit_configs_utils' bundled default -
# only addition is the "arm" group's longest_valid_segment_fraction below.
planning_plugins:
  - ompl_interface/OMPLPlanner
request_adapters:
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision
response_adapters:
  - default_planning_response_adapters/AddTimeOptimalParameterization
  - default_planning_response_adapters/ValidateSolution
  - default_planning_response_adapters/DisplayMotionPath

# Root-caused 2026-08-13: OMPL's default collision-checking resolution while
# SEARCHING (1% of the state space's max extent) is coarser than MoveIt's final
# ValidateSolution re-check after planning. That gap let OMPL hand over paths
# that "looked" collision-free at its own sample points but actually clipped
# through a real link_1/link_6 self-collision between them - caught every time
# by ValidateSolution (INVALID_MOTION_PLAN), but never avoided during the
# search itself. Tightened 10x so the search can't accept what the final check
# would reject.
arm:
  longest_valid_segment_fraction: 0.001
