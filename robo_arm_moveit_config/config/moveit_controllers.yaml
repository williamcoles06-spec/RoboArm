# MoveIt uses this configuration for controller management

# false: no ros2_control here (bypassed on purpose, see ROBOT_ARM_HANDOFF.md §7) -
# MoveIt should not try to activate/switch controllers itself, just send trajectories.
moveit_manage_controllers: false

# Execution duration monitoring: MoveIt watches the clock while a trajectory
# executes and aborts with TIMED_OUT if it runs long relative to the planned
# duration. The defaults (1.1x scaling + 0.5s margin) are too tight for this
# hardware - large single-joint rotations (e.g. J3) legitimately take several
# real seconds, plus canbus_bridge.py's own arrival verification adds a bit
# more on top of that. These must stay nested under trajectory_execution: -
# the underlying C++ node reads them as "trajectory_execution.<name>", not as
# bare top-level keys.
trajectory_execution:
  allowed_execution_duration_scaling: 3.0   # was 1.1
  allowed_goal_duration_margin: 5.0         # was 0.5

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: ""   # required key (moveit_simple_controller_manager silently skips
                    # a controller without it); empty = action name is just "arm_controller"
    joints:
      - revolute_1
      - revolute_2
      - revolute_3
      - revolute_4
      - revolute_5
      - revolute_6